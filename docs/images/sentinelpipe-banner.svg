<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SentinelPipe Gazetent banner</title>
  <desc id="desc">Deterministic LLM and agent red teaming banner for SentinelPipe Gazetent.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1110" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#050913"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(978 120) rotate(134.882) scale(392.512 187.176)">
      <stop stop-color="#46D7FF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#46D7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(259 501) rotate(-28.8) scale(367.262 171.456)">
      <stop stop-color="#5B8CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="148" y1="138" x2="1133" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAFBFF"/>
      <stop offset="0.53" stop-color="#CFF6FF"/>
      <stop offset="1" stop-color="#A9E5FF"/>
    </linearGradient>
    <linearGradient id="subhero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2FDFF"/>
      <stop offset="1" stop-color="#C9F0FF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A4FFFF"/>
      <stop offset="1" stop-color="#3BD4FF"/>
    </linearGradient>
    <linearGradient id="terminalStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5D8BFF"/>
      <stop offset="1" stop-color="#F04DFF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glowB)"/>

  <g opacity="0.35" stroke="#57D8FF" stroke-width="2">
    <path d="M86 102C152 150 150 250 103 304C67 345 68 394 119 436"/>
